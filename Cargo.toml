[package]
name = "clipvault"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Private-by-default clipboard history with cloud semantic search"
license = "MIT"
repository = "https://github.com/ErsatzHitman/clipvault"

[dependencies]
anyhow = "1"
base64 = "0.22"
arboard = { version = "3.7", features = ["wayland-data-control"] }
crossbeam-channel = "0.5"
directories = "6"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
enigo = "0.6"
fs2 = "0.4"
global-hotkey = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["res"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[package.metadata.bundle]
name = "ClipVault"
identifier = "io.github.ErsatzHitman.clipvault"
category = "Utility"
short_description = "Clipboard history and semantic search"
